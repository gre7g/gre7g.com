AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::Serverless-2016-10-31

Parameters:
  EnableDeletionProtection:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

Conditions:
  DeletionProtectionEnabled: !Equals [!Ref EnableDeletionProtection, "true"]

Globals:
  Function:
    Runtime: python3.14
    MemorySize: 128
    Tracing: Active
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: gre7g-site
    Layers:
      - !Sub arn:aws:lambda:${AWS::Region}:017000801446:layer:AWSLambdaPowertoolsPythonV2:68

Resources:
  SecretKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}-secret-key
      Description: Secret key for CSRF HMAC

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    UpdateReplacePolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-user-pool
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub ${AWS::StackName}-auth
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DeletionPolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    UpdateReplacePolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    Properties:
      ClientName: !Sub ${AWS::StackName}-user-pool-client
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs:
        - https://%%CLOUDFRONT_DOMAIN%%
      SupportedIdentityProviders:
        - COGNITO

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        Authorizers:
          CognitoJWTAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient

  AuditLogStorage:
    Type: AWS::S3::Bucket
    DeletionPolicy: !If [ DeletionProtectionEnabled, Retain, Delete ]
    UpdateReplacePolicy: !If [ DeletionProtectionEnabled, Retain, Delete ]
    Properties:
      BucketName: !Sub ${AWS::StackName}-audit-log
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  ProductsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [ DeletionProtectionEnabled, Retain, Delete ]
    UpdateReplacePolicy: !If [ DeletionProtectionEnabled, Retain, Delete ]
    Properties:
      TableName: !Sub ${AWS::StackName}-products
      AttributeDefinitions:
        - AttributeName: product_id
          AttributeType: S
      KeySchema:
        - AttributeName: product_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  CartsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [ DeletionProtectionEnabled, Retain, Delete ]
    UpdateReplacePolicy: !If [ DeletionProtectionEnabled, Retain, Delete ]
    Properties:
      TableName: !Sub ${AWS::StackName}-carts
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  OrdersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [ DeletionProtectionEnabled, Retain, Delete ]
    UpdateReplacePolicy: !If [ DeletionProtectionEnabled, Retain, Delete ]
    Properties:
      TableName: !Sub ${AWS::StackName}-orders
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: order_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: order_id
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  Lib:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub ${AWS::StackName}-lib
      ContentUri: gre7g_lib
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.14

  CartFetchFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    UpdateReplacePolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    Properties:
      FunctionName: !Sub ${AWS::StackName}-cart-fetch
      CodeUri: src/api
      Handler: cart_fetch.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CartsTable
      Environment:
        Variables:
          JWKS_URI: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json"
          CARTS_TABLE: !Ref CartsTable
      Layers:
        - !Ref Lib
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /api/v1/cart
            Method: get
            ApiId: !Ref Api

  CartUpdateFunction:
    Type: AWS::Serverless::Function
    DependsOn: SecretKey
    DeletionPolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    UpdateReplacePolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    Properties:
      FunctionName: !Sub ${AWS::StackName}-cart-update
      CodeUri: src/api
      Handler: cart_update.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CartsTable
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref SecretKey
      Environment:
        Variables:
          JWKS_URI: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json"
          CARTS_TABLE: !Ref CartsTable
          SECRET_KEY: !Sub "{{resolve:secretsmanager:${SecretKey}}}"
      Layers:
        - !Ref Lib
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /api/v1/cart
            Method: put
            ApiId: !Ref Api

  AssignOrderIdFunction:
    Type: AWS::Serverless::Function
    DependsOn: SecretKey
    DeletionPolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    UpdateReplacePolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    Properties:
      FunctionName: !Sub ${AWS::StackName}-assign-order-id
      CodeUri: src/api
      Handler: assign_order_id.lambda_handler
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref SecretKey
      Environment:
        Variables:
          JWKS_URI: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json"
          SECRET_KEY: !Sub "{{resolve:secretsmanager:${SecretKey}}}"
      Layers:
        - !Ref Lib
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /api/v1/cart
            Method: post
            ApiId: !Ref Api

  LogAuditEventFunction:
    Type: AWS::Serverless::Function
    DependsOn: SecretKey
    DeletionPolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    UpdateReplacePolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    Properties:
      FunctionName: !Sub ${AWS::StackName}-log-audit-event
      CodeUri: src/api
      Handler: log_audit.lambda_handler
      Timeout: 30  # Writing to s3 can take more than 3s
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref AuditLogStorage
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref SecretKey
      Environment:
        Variables:
          JWKS_URI: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json"
          AUDIT_LOG_STORAGE: !Ref AuditLogStorage
          SECRET_KEY: !Sub "{{resolve:secretsmanager:${SecretKey}}}"
      Layers:
        - !Ref Lib
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /api/v1/click_id
            Method: post
            ApiId: !Ref Api

  DownloadFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    UpdateReplacePolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    Properties:
      FunctionName: !Sub ${AWS::StackName}-download
      CodeUri: src/api
      Handler: download.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OrdersTable
        - S3ReadPolicy:
            BucketName: gre7g-com-downloads
      Environment:
        Variables:
          JWKS_URI: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json"
          ORDERS_TABLE: !Ref OrdersTable
      Layers:
        - !Ref Lib
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /api/v1/download/{order_id}
            Method: get
            ApiId: !Ref Api

  CreateGuestFunction:
    Type: AWS::Serverless::Function
    DependsOn: SecretKey
    DeletionPolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    UpdateReplacePolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    Properties:
      FunctionName: !Sub ${AWS::StackName}-create-guest
      CodeUri: src/api
      Handler: create_guest.lambda_handler
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref SecretKey
      Environment:
        Variables:
          JWKS_URI: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json"
          SECRET_KEY: !Sub "{{resolve:secretsmanager:${SecretKey}}}"
      Layers:
        - !Ref Lib
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /api/v1/guest
            Method: post
            ApiId: !Ref Api

  MergeGuestFunction:
    Type: AWS::Serverless::Function
    DependsOn: SecretKey
    DeletionPolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    UpdateReplacePolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    Properties:
      FunctionName: !Sub ${AWS::StackName}-merge-guest
      CodeUri: src/api
      Handler: merge_guest.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CartsTable
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref SecretKey
      Environment:
        Variables:
          JWKS_URI: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json"
          CARTS_TABLE: !Ref CartsTable
          SECRET_KEY: !Sub "{{resolve:secretsmanager:${SecretKey}}}"
      Layers:
        - !Ref Lib
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /api/v1/guest
            Method: put
            ApiId: !Ref Api

  GetOrdersFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    UpdateReplacePolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    Properties:
      FunctionName: !Sub ${AWS::StackName}-get-orders
      CodeUri: src/api
      Handler: get_orders.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OrdersTable
      Environment:
        Variables:
          JWKS_URI: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json"
          ORDERS_TABLE: !Ref OrdersTable
      Layers:
        - !Ref Lib
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /api/v1/orders
            Method: get
            ApiId: !Ref Api

  GetProductsFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    UpdateReplacePolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    Properties:
      FunctionName: !Sub ${AWS::StackName}-get-products
      CodeUri: src/api
      Handler: get_products.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ProductsTable
      Environment:
        Variables:
          JWKS_URI: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json"
          PRODUCTS_TABLE: !Ref ProductsTable
      Layers:
        - !Ref Lib
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /api/v1/products
            Method: get
            ApiId: !Ref Api

  WebFileStorage:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-web

  WebFileStoragePolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebFileStorage
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebFileStorage.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

  WebAccessConfig:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebFileStorage.RegionalDomainName
            OriginAccessControlId: !Ref WebAccessConfig
            S3OriginConfig: {}
          - Id: ApiOrigin
            DomainName: !Sub ${Api}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: https-only
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

Outputs:
  APIEndpoint:
    Description: Used by integration tests
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com"

  WebDistribution:
    Description: Cache mechanism
    Value: !Ref WebDistribution

  CognitoHostName:
    Description: Used by the HTML script
    Value: !Sub "${AWS::StackName}-auth.auth.${AWS::Region}.amazoncognito.com"

  CognitoLoginURL:
    Description: Used by the HTML script
    Value: !Sub "https://${AWS::StackName}-auth.auth.${AWS::Region}.amazoncognito.com/login?client_id=${UserPoolClient}&response_type=code&scope=openid&redirect_uri=https://${WebDistribution.DomainName}"

  WebsiteURL:
    Description: Used in manual testing
    Value: !Sub "https://${WebDistribution.DomainName}"

  AuditLog:
    Description: Used by integration tests
    Value: !Ref AuditLogStorage

  ProductsTableName:
    Description: Used by integration tests
    Value: !Ref ProductsTable

  CartsTableName:
    Description: Used by integration tests
    Value: !Ref CartsTable

  OrdersTableName:
    Description: Used by integration tests
    Value: !Ref OrdersTable

  WebFileStorage:
    Description: Used by dispatch script
    Value: !Ref WebFileStorage

  UserPool:
    Description: Used by integration tests
    Value: !Ref UserPool

  UserPoolClient:
    Description: Used by integration tests
    Value: !Ref UserPoolClient
