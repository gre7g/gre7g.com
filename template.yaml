AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::Serverless-2016-10-31

Parameters:
  CsrfSecretKey:
    Type: String

  PaypalSandbox:
    Type: String

  PaypalClientId:
    Type: String

  PaypalClientSecret:
    Type: String

  EnableDeletionProtection:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]

Conditions:
  DeletionProtectionEnabled: !Equals [!Ref EnableDeletionProtection, "true"]

Globals:
  Function:
    Runtime: python3.14
    MemorySize: 128
    Tracing: Active
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: gre7g-site
    Layers:
      - !Sub arn:aws:lambda:${AWS::Region}:017000801446:layer:AWSLambdaPowertoolsPythonV2:68

Resources:
# Regretfully, I'm removing my reliance on AWS SecretsManager. This is a good module, and I'm sure if I needed it, then
# it would be well worth the charges. I doubt I could live without it. But the simple fact is that I don't need this.
# I'm only using it to create a secret for the CSRF validation which prevents a low-risk attack on low-value data on a
# low-value website. This module is racking up a lot of charges, and its value to me just doesn't justify the expense.
# So, I'm replacing the SecretsManager with generating a secret in my dispatch.py script and passing it in as a
# parameter. I'll leave some of the SecretManager stuff in and comment it out in case I ever want to find this again.
#
#  CsrfSecretKey:
#    Type: AWS::SecretsManager::Secret
#    Properties:
#      Name: !Sub ${AWS::StackName}-secret-key
#      Description: Secret key for CSRF HMAC

  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    UpdateReplacePolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-user-pool
      UserPoolTier: ESSENTIALS
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub ${AWS::StackName}-auth
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DeletionPolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    UpdateReplacePolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    Properties:
      ClientName: !Sub ${AWS::StackName}-user-pool-client
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs:
        - https://%%CLOUDFRONT_DOMAIN%%
      LogoutURLs:
        - https://%%CLOUDFRONT_DOMAIN%%
      SupportedIdentityProviders:
        - COGNITO

  LoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    DeletionPolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    UpdateReplacePolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref UserPoolClient
      UseCognitoProvidedValues: true

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        Authorizers:
          CognitoJWTAuthorizer:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient

  AuditLogStorage:
    Type: AWS::S3::Bucket
    DeletionPolicy: !If [ DeletionProtectionEnabled, Retain, Delete ]
    UpdateReplacePolicy: !If [ DeletionProtectionEnabled, Retain, Delete ]
    Properties:
      BucketName: !Sub ${AWS::StackName}-audit-log
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  ProductsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [ DeletionProtectionEnabled, Retain, Delete ]
    UpdateReplacePolicy: !If [ DeletionProtectionEnabled, Retain, Delete ]
    Properties:
      TableName: !Sub ${AWS::StackName}-products
      AttributeDefinitions:
        - AttributeName: product_id
          AttributeType: S
      KeySchema:
        - AttributeName: product_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  CartsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [ DeletionProtectionEnabled, Retain, Delete ]
    UpdateReplacePolicy: !If [ DeletionProtectionEnabled, Retain, Delete ]
    Properties:
      TableName: !Sub ${AWS::StackName}-carts
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  OrdersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [ DeletionProtectionEnabled, Retain, Delete ]
    UpdateReplacePolicy: !If [ DeletionProtectionEnabled, Retain, Delete ]
    Properties:
      TableName: !Sub ${AWS::StackName}-orders
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: order_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: order_id
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  Lib:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub ${AWS::StackName}-lib
      ContentUri: lib/deploy
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.14

  CartFetchFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    UpdateReplacePolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    Properties:
      FunctionName: !Sub ${AWS::StackName}-cart-fetch
      CodeUri: src/api
      Handler: cart_fetch.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CartsTable
      Environment:
        Variables:
          JWKS_URI: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json"
          CARTS_TABLE: !Ref CartsTable
          CSRF_SECRET_KEY: !Ref CsrfSecretKey
      Layers:
        - !Ref Lib
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /api/v1/cart
            Method: get
            ApiId: !Ref Api

  CartUpdateFunction:
    Type: AWS::Serverless::Function
#    DependsOn: CsrfSecretKey
    DeletionPolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    UpdateReplacePolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    Properties:
      FunctionName: !Sub ${AWS::StackName}-cart-update
      CodeUri: src/api
      Handler: cart_update.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CartsTable
#        - AWSSecretsManagerGetSecretValuePolicy:
#            SecretArn: !Ref CsrfSecretKey
      Environment:
        Variables:
          JWKS_URI: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json"
          CARTS_TABLE: !Ref CartsTable
#          CSRF_SECRET_KEY: !Sub "{{resolve:secretsmanager:${CsrfSecretKey}}}"
          CSRF_SECRET_KEY: !Ref CsrfSecretKey
      Layers:
        - !Ref Lib
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /api/v1/cart
            Method: put
            ApiId: !Ref Api

  AssignOrderIdFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    UpdateReplacePolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    Properties:
      FunctionName: !Sub ${AWS::StackName}-assign-order-id
      CodeUri: src/api
      Handler: assign_order_id.lambda_handler
      Environment:
        Variables:
          JWKS_URI: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json"
          CSRF_SECRET_KEY: !Ref CsrfSecretKey
      Layers:
        - !Ref Lib
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /api/v1/cart
            Method: post
            ApiId: !Ref Api

  CalculateShippingFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    UpdateReplacePolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    Properties:
      FunctionName: !Sub ${AWS::StackName}-calculate-shipping
      CodeUri: src/api
      Handler: calculate_shipping.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CartsTable
      Environment:
        Variables:
          JWKS_URI: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json"
          CARTS_TABLE: !Ref CartsTable
          CSRF_SECRET_KEY: !Ref CsrfSecretKey
      Layers:
        - !Ref Lib
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /api/v1/cart/shipping
            Method: post
            ApiId: !Ref Api

  LogAuditEventFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    UpdateReplacePolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    Properties:
      FunctionName: !Sub ${AWS::StackName}-log-audit-event
      CodeUri: src/api
      Handler: log_audit.lambda_handler
      Timeout: 30  # Writing to s3 can take more than 3s
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref AuditLogStorage
      Environment:
        Variables:
          JWKS_URI: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json"
          AUDIT_LOG_STORAGE: !Ref AuditLogStorage
          CSRF_SECRET_KEY: !Ref CsrfSecretKey
      Layers:
        - !Ref Lib
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /api/v1/click_id
            Method: post
            ApiId: !Ref Api

  DownloadFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    UpdateReplacePolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    Properties:
      FunctionName: !Sub ${AWS::StackName}-download
      CodeUri: src/api
      Handler: download.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OrdersTable
        - S3ReadPolicy:
            BucketName: gre7g-com-downloads
      Environment:
        Variables:
          JWKS_URI: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json"
          ORDERS_TABLE: !Ref OrdersTable
          CSRF_SECRET_KEY: !Ref CsrfSecretKey
      Layers:
        - !Ref Lib
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /api/v1/download/{order_id}
            Method: get
            ApiId: !Ref Api

  CreateGuestFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    UpdateReplacePolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    Properties:
      FunctionName: !Sub ${AWS::StackName}-create-guest
      CodeUri: src/api
      Handler: create_guest.lambda_handler
      Environment:
        Variables:
          JWKS_URI: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json"
          CSRF_SECRET_KEY: !Ref CsrfSecretKey
      Layers:
        - !Ref Lib
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /api/v1/guest
            Method: post
            ApiId: !Ref Api

  MergeGuestFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    UpdateReplacePolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    Properties:
      FunctionName: !Sub ${AWS::StackName}-merge-guest
      CodeUri: src/api
      Handler: merge_guest.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CartsTable
      Environment:
        Variables:
          JWKS_URI: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json"
          CARTS_TABLE: !Ref CartsTable
          CSRF_SECRET_KEY: !Ref CsrfSecretKey
      Layers:
        - !Ref Lib
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /api/v1/guest
            Method: put
            ApiId: !Ref Api

  GetOrdersFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    UpdateReplacePolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    Properties:
      FunctionName: !Sub ${AWS::StackName}-get-orders
      CodeUri: src/api
      Handler: get_orders.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref OrdersTable
      Environment:
        Variables:
          JWKS_URI: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json"
          ORDERS_TABLE: !Ref OrdersTable
          CSRF_SECRET_KEY: !Ref CsrfSecretKey
      Layers:
        - !Ref Lib
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /api/v1/order
            Method: get
            ApiId: !Ref Api

  PlaceOrderFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    UpdateReplacePolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    Properties:
      FunctionName: !Sub ${AWS::StackName}-place-order
      CodeUri: src/api
      Handler: place_order.lambda_handler
      Timeout: 30  # Writing to s3 can take more than 3s
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CartsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ProductsTable
        - S3CrudPolicy:
            BucketName: !Ref AuditLogStorage
      Environment:
        Variables:
          JWKS_URI: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json"
          CARTS_TABLE: !Ref CartsTable
          PRODUCTS_TABLE: !Ref ProductsTable
          AUDIT_LOG_STORAGE: !Ref AuditLogStorage
          CSRF_SECRET_KEY: !Ref CsrfSecretKey
          PAYPAL_SANDBOX: !Ref PaypalSandbox
          PAYPAL_CLIENT_ID: !Ref PaypalClientId
          PAYPAL_CLIENT_SECRET: !Ref PaypalClientSecret
      Layers:
        - !Ref Lib
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /api/v1/order
            Method: post
            ApiId: !Ref Api

  ConfirmOrderFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    UpdateReplacePolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    Properties:
      FunctionName: !Sub ${AWS::StackName}-confirm-order
      CodeUri: src/api
      Handler: confirm_order.lambda_handler
      Timeout: 30  # Writing to s3 can take more than 3s
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CartsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref OrdersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductsTable
        - S3CrudPolicy:
            BucketName: !Ref AuditLogStorage
      Environment:
        Variables:
          JWKS_URI: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json"
          AUDIT_LOG_STORAGE: !Ref AuditLogStorage
          CARTS_TABLE: !Ref CartsTable
          ORDERS_TABLE: !Ref OrdersTable
          PRODUCTS_TABLE: !Ref ProductsTable
          CSRF_SECRET_KEY: !Ref CsrfSecretKey
          PAYPAL_SANDBOX: !Ref PaypalSandbox
          PAYPAL_CLIENT_ID: !Ref PaypalClientId
          PAYPAL_CLIENT_SECRET: !Ref PaypalClientSecret
      Layers:
        - !Ref Lib
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /api/v1/order/{order_id}
            Method: put
            ApiId: !Ref Api

  GetProductsFunction:
    Type: AWS::Serverless::Function
    DeletionPolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    UpdateReplacePolicy: !If [DeletionProtectionEnabled, Retain, Delete]
    Properties:
      FunctionName: !Sub ${AWS::StackName}-get-products
      CodeUri: src/api
      Handler: get_products.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ProductsTable
      Environment:
        Variables:
          JWKS_URI: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json"
          PRODUCTS_TABLE: !Ref ProductsTable
          CSRF_SECRET_KEY: !Ref CsrfSecretKey
      Layers:
        - !Ref Lib
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /api/v1/products
            Method: get
            ApiId: !Ref Api

  WebFileStorage:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-web

  WebFileStoragePolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebFileStorage
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebFileStorage.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

  WebAccessConfig:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt WebFileStorage.RegionalDomainName
            OriginAccessControlId: !Ref WebAccessConfig
            S3OriginConfig: {}
          - Id: ApiOrigin
            DomainName: !Sub ${Api}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: https-only
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
            AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]

Outputs:
  # CAUTION: I keep all these values in a web-accessible location. Secret information may appear in environment
  # variables (above), but do NOT put any of that in these outputs!
  APIEndpoint:
    Description: Used by integration tests
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com"

  AuditLog:
    Description: Used by integration tests
    Value: !Ref AuditLogStorage

  CartsTableName:
    Description: Used by integration tests
    Value: !Ref CartsTable

  CognitoHostName:
    Description: Used by the HTML script & integration tests
    Value: !Sub "${AWS::StackName}-auth.auth.${AWS::Region}.amazoncognito.com"

  CognitoLoginURL:
    Description: Used by the HTML script
    Value: !Sub "https://${AWS::StackName}-auth.auth.${AWS::Region}.amazoncognito.com/login?client_id=${UserPoolClient}&response_type=code&scope=openid&redirect_uri=https://${WebDistribution.DomainName}/login"

  OrdersTableName:
    Description: Used by integration tests
    Value: !Ref OrdersTable

  PaypalClientId:
    Description: Used by the HTML script
    Value: !Ref PaypalClientId

  ProductsTableName:
    Description: Used by integration tests
    Value: !Ref ProductsTable

  UserPool:
    Description: Used by integration tests
    Value: !Ref UserPool

  UserPoolClient:
    Description: Used by integration tests
    Value: !Ref UserPoolClient

  WebDistribution:
    Description: Used by dispatch script
    Value: !Ref WebDistribution

  WebFileStorage:
    Description: Used by dispatch script
    Value: !Ref WebFileStorage

  WebsiteURL:
    Description: Used in manual testing
    Value: !Sub "https://${WebDistribution.DomainName}"
