openapi: 3.0.1
info:
  title: Backend API
  description: Lambda backend API for gre7g.com
  version: 0.0.0

components:
  schemas:
    error-message:
      type: object
      properties:
        message:
          type: string
          description: Any additional information about the error
      additionalProperties: false
      required:
        - message

    empty:
      type: object
      additionalProperties: false

    product:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        listing_path:
          type: string
          description: Informational only
        product_id:
          type: string
        quantity:
          type: number
        cost_per:
          type: number
          description: |
            CAUTION: This field is informational and should never be considered authoritative! The user could PUT any 
            cost when they update their cart, but we MUST refer to authoritative price during check-out.
        downloads:
          type: array
          description: Filenames for digital downloads associated with this item
          items:
            type: string
        media:
          type: string
          description: paperback, ebook, etc.
        status:
          type: string
          description: available, sold_out, ordered, canceled, shipped, partial, downloaded, or refunded
        parent_id:
          type: string
          nullable: true
        child_ids:
          type: array
          items:
            type: string
      additionalProperties: false
      required:
        - name
        - description
        - listing_path
        - product_id
        - quantity
        - cost_per
        - downloads
        - media
        - status
        - parent_id
        - child_ids

    product_list:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/product"
      additionalProperties: false
      required:
        - products

  responses:
    # Note: I much prefer this "NNN-explanation" style naming for common responses. It's much more clear for engineers
    # who haven't memorized the status codes beyond 200, 404, and 500 (such as myself). However, if we eventually need
    # to event buses or mailboxes, some stuff will have to change in this file, and the named error tags are one of
    # them. Sadly, if AWS SAM needs to inspect this file, it will insist that they are simply "400", "401", etc. It will
    # also insist that identifiers like owner_id are changed to ownerId. This seems ridiculous to me, and I'd much
    # prefer they were consistent with how the identifiers are named in the Python code (i.e. according to Python
    # standards), but there's no arguing with code, is there?
    "400-bad-request":
      description: Request was malformed or parameters were in some way unexpected.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error-message"

    "401-unauthorized":
      description: Request did not provide sufficient authorization to access resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error-message"

    "403-forbidden":
      description: User lacks sufficient privileges to access this resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error-message"

    "500-internal-server-error":
      description: One of the application's scripts threw an uncaught error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error-message"

  parameters:
    order_id:
      name: order_id
      in: path
      required: true
      schema:
        type: string

paths:
  /api/v1/cart:
    get:
      summary: View shopping cart
      description: Get a list of all items in shopping cart
      responses:
        "200":
          description: Successful fetch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/product_list"
        "403":
          $ref: "#/components/responses/403-forbidden"
        "500":
          $ref: "#/components/responses/500-internal-server-error"

    put:
      summary: Update shopping cart
      description: Set the shopping cart contents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/product_list"
      responses:
        "200":
          description: Successful update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/empty"
        "403":
          $ref: "#/components/responses/403-forbidden"
        "500":
          $ref: "#/components/responses/500-internal-server-error"

    post:
      summary: Assign order_id
      description: Begin the purchase process by assigning an order_id to the items in the cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/empty"
      responses:
        "201":
          description: Successful assignment
          content:
            application/json:
              schema:
                type: object
                properties:
                  order_id:
                    type: string
                additionalProperties: false
                required:
                  - order_id
        "500":
          $ref: "#/components/responses/500-internal-server-error"

  /api/v1/cart/shipping:
    post:
      summary: Calculate shipping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/empty"
      responses:
        "201":
          description: Successful calculation
          content:
            application/json:
              schema:
                type: object
                properties:
                  shipping_cost:
                    type: number
                  user_status:
                    type: string
                additionalProperties: false
                required:
                  - shipping_cost
                  - user_status

  /api/v1/click_id:
    post:
      summary: Log a click_id
      description: Save a click_id into the database for future analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                click_id:
                  type: string
              additionalProperties: false
              required:
                - click_id
      responses:
        "201":
          description: Successful log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/empty"
        "500":
          $ref: "#/components/responses/500-internal-server-error"

  /api/v1/download/{order_id}:
    get:
      summary: Download a file
      description: Request a digital download from a previous purchase
      parameters:
        - $ref: "#/components/parameters/order_id"
      responses:
        "200":
          description: Successful download
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: object
                    additionalProperties:
                      type: string
                additionalProperties: false
                required:
                  - files
        "401":
          $ref: "#/components/responses/401-unauthorized"
        "403":
          $ref: "#/components/responses/403-forbidden"
        "500":
          $ref: "#/components/responses/500-internal-server-error"

  /api/v1/guest:
    post:
      summary: Create a guest authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/empty"
      responses:
        "201":
          description: Successful authorization
          content:
            application/json:
              schema:
                type: object
                properties:
                  auth_token:
                    type: string
                additionalProperties: false
                required:
                  - auth_token
        "500":
          $ref: "#/components/responses/500-internal-server-error"

    put:
      summary: Merge guest authorization
      description: User has logged in, so merge any cart items into their account cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/empty"
      responses:
        "200":
          description: Successful merge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/empty"
        "400":
          $ref: "#/components/responses/400-bad-request"
        "403":
          $ref: "#/components/responses/403-forbidden"
        "500":
          $ref: "#/components/responses/500-internal-server-error"

  /api/v1/order:
    get:
      summary: Get orders
      description: Get a list of all previous orders
      responses:
        "200":
          description: Successful fetch
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      type: object
                      properties:
                        products:
                          type: array
                          items:
                            $ref: "#/components/schemas/product"
                        subtotal_cost:
                          type: number
                        shipping_cost:
                          type: number
                        total_cost:
                          type: number
                        discount:
                          type: number
                        order_id:
                          type: string
                        timestamp:
                          type: string
                        notes:
                          type: array
                          items:
                            type: string
                      additionalProperties: false
                      required:
                        - products
                        - subtotal_cost
                        - shipping_cost
                        - total_cost
                        - discount
                        - timestamp
                        - notes
                additionalProperties: false
                required:
                  - orders
        "403":
          $ref: "#/components/responses/403-forbidden"
        "500":
          $ref: "#/components/responses/500-internal-server-error"

    post:
      summary: Submit an order
      description: Send an order to PayPal for processing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/empty"
      responses:
        "201":
          description: Purchase success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  links:
                    type: array
                    items:
                      type: object
                      properties:
                        href:
                          type: string
                        method:
                          type: string
                        rel:
                          type: string
                      additionalProperties: false
                      required:
                        - href
                        - method
                        - rel
                  status:
                    type: string
                  out_of_stock:
                    type: array
                    items:
                      type: string
                additionalProperties: false
                required:
                  - status

  /api/v1/order/{order_id}:
    put:
      summary: Confirm an order
      description: Verify that an order processed successfully
      parameters:
        - $ref: "#/components/parameters/order_id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/empty"
      responses:
        "200":
          description: Successful confirmation
        "500":
          $ref: "#/components/responses/500-internal-server-error"

  /api/v1/products:
    get:
      summary: View wares
      description: Get a list of all items available for purchase
      responses:
        "200":
          description: Successful fetch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/product_list"
        "500":
          $ref: "#/components/responses/500-internal-server-error"
